<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="lista_tareas.js" defer></script>    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body class="container at-5">
    <h1>Lista de tareas</h1>
    <h2>Ingreso de tareas</h2>
    <section>
    <form class="row g-3">

        <div class="col-auto">
            <label for="staticEmail2" class="visually-hidden">Email</label>
            <input type="text" readonly class="form-control-plaintext" id="staticEmail2" value="Tarea para trabajar">
        </div>
        <div class="col-auto">
            <label for="txtTarea" class="visually-hidden">Tarea</label>
            <input id="txtTarea" type="text" class="form-control" placeholder="Tarea">
        </div>

        <div class="col-auto">
            <button id="btnAgregar" type="button" class="btn btn-primary mb-3">Agregar tarea <i class="bi bi-android"></i></button>
            <button id="btnEditar" type="button" class="btn btn-primary mb-3">Editar tarea</button>
            <button id="btnBorrar" type="button" class="btn btn-primary mb-3">Borrar tarea</button>
            <button id="btnBuscar" type="button" class="btn btn-primary mb-3">Buscar tarea</button>
            <button type="button" class="btn btn-danger mb-3">Danger</button>
        </div>
    </form>


    <!-- CAJON DE TAREAS -->

    <div class="card" style="width: 18rem;">
    <img src="hyrax.png" class="card-img-top" alt="hyrax">
    <div class="card-body">
    <h5 class="card-title">Lista de tareas</h5>
    <p class="card-text">Ejemplo basado en Bootstrap</p>
  </div>
        <div class="card-body">
            <ul id="listaTareas" class="list-group">
            </ul>
        </div>
    </div>
    </section>
</body>
</html>
