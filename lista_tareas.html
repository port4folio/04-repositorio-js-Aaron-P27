<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="lista_tareas.js" defer></script> 
</head>
<body class="container mt-5">
    <h1 class="mb-3">Lista de tareas</h1>
    <h2 class="h5 text-muted mb-4">Ingreso de tareas</h2>
    
    <section>
        <form class="row g-3 align-items-center mb-4">
            <div class="col-auto">
                <label for="staticEmail2" class="visually-hidden">Email</label>
                <input type="text" readonly class="form-control-plaintext fw-bold" id="staticEmail2" value="Tarea para trabajar:">
            </div>
            <div class="col-auto">
                <label for="txtTarea" class="visually-hidden">Tarea</label>
                <input id="txtTarea" type="text" class="form-control" placeholder="Escribe aquí...">
            </div>
            <div class="col-auto">
                <button id="btnAgregar" type="button" class="btn btn-primary">Agregar <i class="bi bi-android"></i></button>
                <button id="btnEditar" type="button" class="btn btn-warning text-white">Editar</button>
                <button id="btnEliminar" type="button" class="btn btn-danger">Borrar por Texto</button>
                <button id="btnBuscar" type="button" class="btn btn-secondary">Buscar</button>
            </div>
        </form>

        <div class="card" style="width: 22rem;">
            <img src="hyrax.png" class="card-img-top" alt="hyrax" onerror="this.style.display='none'">
            <div class="card-body pb-1">
                <h5 class="card-title m-0">Mis Pendientes</h5>
                <p class="card-text text-muted small">Ejemplo basado en Bootstrap</p>
            </div>
            <div class="card-body pt-0">
                <ul id="listaTareas" class="list-group list-group-flush">
                    </ul>
            </div>
        </div>
    </section>
<div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalEditarLabel"></h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
            <label for="tarea_nueva" class="col_form_lagbel">Nueva tarea</label>
            <input type="text" class="form-control" id="tarea_nueva">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" id="btnGuardar" class="btn btn-dark bi bi-floppy">Guardar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="modalEliminarLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalEliminarLabel"></h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
            <h3>¿Esta seguro de borrar?</h3>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" id="btnDelete" class="btn btn-dark bi bi-floppy">Eliminar</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
